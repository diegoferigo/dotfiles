format = """\
[╭── ](bold white)$container$all[╰─](bold white)$character"""

[username]
show_always = true
style_user = "bold purple"
style_root = "bold red"
format = "[$user]($style) "

[character]
success_symbol = "[\uF0DA](bold green)"
error_symbol = "[\uF0DA](bold red)"

[[battery.display]]
threshold = 2
style = "bold red"

[conda]
format = "[$symbol$environment  ](green bold)"

[git_branch]
disabled = true

# Replaces git_branch so the name can be shortened to the terminal width (STARSHIP_BRANCH_MAX, set in .bashrc.d/ps1).
[custom.git_branch]
when = "git rev-parse --git-dir"
shell = ["bash", "--noprofile", "--norc"]
command = """
b=$(git branch --show-current 2>/dev/null)
[ -n "$b" ] || b=$(git rev-parse --short HEAD 2>/dev/null)
max=${STARSHIP_BRANCH_MAX:-40}
[ ${#b} -gt "$max" ] && b="${b:0:max-1}…"
printf '%s' "$b"
"""
format = "on [\U000F062C $output]($style) "
style = "dimmed"

[git_status]
disabled=true

[gcloud]
disabled=true

[python]
detect_files = []
detect_extensions = []
detect_folders = []

[pixi]
symbol = "✨"
format = 'via [$symbol $environment]($style)'
detect_files = []
detect_extensions = []
detect_folders = []
show_default_environment = false

[container]
symbol = "🐳"
style = "fg:#1E90FF bold"
format = '[$symbol]($style) '
