format = """\
[╭─ ](bold white)$all[╰─ ](bold white)$character"""

[username]
show_always = true
style_user = "bold purple"
style_root = "bold red"
format = "[$user]($style) "

#[hostname]
#disabled = true

#[directory]
#style = "bold cyan"
#truncation_length = 3
#truncate_to_repo = false

#[cmd_duration]
#min_time = 0
#show_milliseconds = true
#style = "yellow"
#format = "[⏱ took $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[[battery.display]]
threshold = 2
style = "bold red"

[conda]
format = "[$symbol$environment  ](green bold)"

[git_status]
disabled=true

[gcloud]
disabled=true

[pixi]
symbol = "✨"
format = 'via [$symbol $environment]($style)'

[container]
symbol = "🐳"
style = "fg:#1E90FF bold"
format = '[$symbol]($style) '
