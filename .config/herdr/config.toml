onboarding = false

[terminal]
default_shell = "bash"

[ui]
status_indicators = "symbols"
sidebar_width = 44
sidebar_max_width = 60
agent_panel_sort = "priority"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#e6e6e6", bold = true }],
  [{ token = "branch", fg = "#61afef", dim = false }, "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "state_text", rules = [
      { equals = "working", fg = "#e5c07b", bold = true },
      { equals = "blocked", fg = "#e06c75", bold = true },
      { equals = "done", fg = "#98c379" },
      { equals = "idle", hide = true },
    ] },
    { token = "machine", rules = [{ equals = "Local", hide = true }] },
    { token = "workspace", fg = "#7f848e", bold = false, dim = false },
    { token = "tab", fg = "#61afef", bold = false, dim = false },
  ],
  [{ token = "terminal_title_stripped", fg = "#e6e6e6", bold = true }],
]

# The worktrunk plugin pickers replace the built-in worktree commands, which run
# no worktrunk hooks. The new-worktree key (prefix+shift+g) is overridden.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

# Saves pane screens to session-history.json so a restarted server restores them (the file may contain secrets).
[experimental]
pane_history = true
