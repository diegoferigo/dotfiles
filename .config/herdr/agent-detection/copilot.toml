# Local override of the herdr detection manifest for Copilot CLI.
# Copy of upstream manifest 2026.08.29.1 plus the rule `working_status_line`.
# Copilot CLI 1.0.116 shows `Working · ... ctrl+c interrupt` in its status line, which
# no upstream rule matches, so herdr reported `idle` (never `done`) while it worked.
# The rule looks only at the bottom lines: a whole-screen match stayed `working` when
# the phrase appeared in the transcript.
# An override replaces the whole manifest and stops upstream updates for copilot.
# Delete it once upstream matches the status line.

id = "copilot"
version = "2026.08.29.1"
min_engine_version = 1
updated_at = "2026-08-29T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]

[[rules]]
id = "working_status_line"
state = "working"
priority = 100
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^\s*\S\s+Working\s+·.*ctrl\+c interrupt']
