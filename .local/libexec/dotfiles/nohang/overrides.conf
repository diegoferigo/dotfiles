# Overrides applied on top of the upstream nohang-desktop.conf by render.py,
# which documents the format.

# Act on real stalls sooner than the upstream 30 s. The value is an estimate,
# tune it if it kills during short spikes.
psi_excess_duration = 10

# Rules are ordered by bonus, from the most protected to the first victim.

# The terminal stack must survive. The kernel truncates process names to 15
# characters, so gnome-terminal-server is matched by its prefix.
@BADNESS_ADJ_RE_NAME -300 /// ^(herdr|tmux|sshd|ptyxis|tilix|ghostty|gnome-terminal)

# Zed is killable, but last.
@BADNESS_ADJ_RE_NAME 100 /// ^(zed|zed-editor)$

# GitKraken and Slack go after the build tools.
@BADNESS_ADJ_RE_NAME 200 /// ^(gitkraken|slack)$

# Chrome, language servers and C++ builds are the usual culprits.
@BADNESS_ADJ_RE_NAME 300 /// ^(chrome|clangd)$
@BADNESS_ADJ_RE_NAME 300 /// ^(c\+\+|g\+\+|gcc|cc1|cc1plus|cicc|ptxas|collect2|ld|ld\.bfd|ld\.gold|ld\.lld|lld|mold|rustc)$

# Firefox goes before Chrome.
@BADNESS_ADJ_RE_NAME 400 /// ^(firefox|firefox-bin|Isolated Web Co|Web Content|WebExtensions|Privileged Cont)$

# The C++ language server of VS Code (mscppls) used to stall the machine while
# indexing, like clangd. A bonus just below colcon kills it right after colcon.
@BADNESS_ADJ_RE_NAME 900 /// ^mscppls$

# colcon is the parent of the ROS builds, and it holds little memory itself, so
# only a bonus above any oom_score (at most 1000) makes it the first victim.
@BADNESS_ADJ_RE_NAME 1000 /// ^colcon$
