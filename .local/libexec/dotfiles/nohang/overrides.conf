# Overrides applied on top of the upstream nohang-desktop.conf by render.py,
# which documents the format.

# Act on real stalls sooner than the upstream 30 s. The value is an estimate,
# tune it if it kills during short spikes.
psi_excess_duration = 10

# Browser tabs and renderers, language servers and C++ builds are the usual
# culprits, so they are killed first.
@BADNESS_ADJ_RE_NAME 300 /// ^(chrome|Isolated Web Co|Web Content|clangd|mscppls)$
@BADNESS_ADJ_RE_NAME 300 /// ^(cc1|cc1plus|cicc|ptxas|collect2|ld|ld\.bfd|ld\.gold|ld\.lld|lld|rustc)$

# The terminal stack and the editors must survive. The kernel truncates process
# names to 15 characters, so a longer name is matched by its prefix.
@BADNESS_ADJ_RE_NAME -300 /// ^(herdr|tmux|sshd|zed|zed-editor|ptyxis)$
@BADNESS_ADJ_RE_NAME -300 /// ^gnome-terminal
