# Overrides applied on top of the upstream nohang-desktop.conf by render.py,
# which documents the format.

# Act on real stalls sooner than the upstream 30 s. The value is an estimate,
# tune it if it kills during short spikes.
psi_excess_duration = 10

# Rules are ordered by bonus, from the first victim to the most protected.

# colcon is the parent of the ROS builds and holds little memory itself, so only
# a bonus above any oom_score (at most 1000) makes it a first victim. Compilers
# and linkers get the same bonus, so a build is killed as a whole.
@BADNESS_ADJ_RE_NAME 1000 /// ^colcon$
@BADNESS_ADJ_RE_NAME 1000 /// ^(c\+\+|g\+\+|gcc|cc1|cc1plus|cicc|ptxas|collect2|ld|ld\.bfd|ld\.gold|ld\.lld|lld|mold|rustc)$

# The C++ language servers used to stall the machine while indexing.
@BADNESS_ADJ_RE_NAME 900 /// ^(clangd|mscppls)$
# mscppls runs as a node process, so it is matched by its command line.
@BADNESS_ADJ_RE_CMDLINE 900 /// /bin/mscppls( |$)

# Firefox goes before Chrome.
@BADNESS_ADJ_RE_NAME 800 /// ^(firefox|firefox-bin|Isolated Web Co|Web Content|WebExtensions|Privileged Cont)$
@BADNESS_ADJ_RE_NAME 700 /// ^chrome$

# GitKraken and Slack are killable, but only after the heavy processes above.
@BADNESS_ADJ_RE_NAME 200 /// ^(gitkraken|slack)$

# Zed is killable, but last.
@BADNESS_ADJ_RE_NAME 100 /// ^(zed|zed-editor)$

# The terminal stack must survive. The kernel truncates process names to 15
# characters, so gnome-terminal-server is matched by its prefix.
@BADNESS_ADJ_RE_NAME -300 /// ^(herdr|tmux|sshd|ptyxis|tilix|ghostty|gnome-terminal)
