# Overrides applied on top of the upstream nohang-desktop.conf by install.sh.
# nohang rejects a config with a missing key, so the upstream file stays the
# base. A `key = value` line replaces the upstream key (install.sh fails when
# the key does not exist), and an `@...` line is appended.

# Act on real stalls sooner than the upstream 30 s.
psi_excess_duration = 10

# Browser tabs and renderers, language servers and C++ builds are the usual
# culprits, so they are killed first.
@BADNESS_ADJ_RE_NAME 300 /// ^(chrome|Isolated Web Co|Web Content|clangd|mscppls)$
@BADNESS_ADJ_RE_NAME 300 /// ^(cc1|cc1plus|cicc|ptxas|collect2|ld|ld\.bfd|ld\.gold|ld\.lld|lld|rustc)$

# The terminal stack and the editors must survive.
@BADNESS_ADJ_RE_NAME -300 /// ^(herdr|tmux|sshd|zed|zed-editor|gnome-terminal-server|ptyxis)$
